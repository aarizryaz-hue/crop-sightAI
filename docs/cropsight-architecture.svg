<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc"><title id="title">CropSight architecture and technology stack</title><desc id="desc">Photos move from the browser to a Node.js server and OpenAI GPT-4o mini, then through structural validation to observations and a supervisor summary. Supporting development tools and Android release status are listed below.</desc><rect width="100%" height="100%" fill="#101d16"/>
<text x="70" y="100.2" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#a7d5a6">CropSight</text>
<text x="70" y="146.68" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#e5efde">How a crop photo becomes a clearer conversation</text>
<text x="1260" y="84.32" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#9ed3a5">TECHNOLOGY &amp; DATA FLOW</text>
<text x="1260" y="120.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#abc0ac">Repository snapshot · October 24, 2026</text>
<rect x="70" y="205" width="500" height="270" rx="22" fill="#1b3023" stroke="#3c5945" stroke-width="2"/>
<text x="95" y="247.24" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9ed3a5">01</text>
<text x="146" y="249.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#edf4e4">Photo in the browser</text>
<text x="95" y="304.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">HTML5 + CSS3 + JavaScript</text>
<text x="95" y="341.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Choose Seeds or Harvest</text>
<text x="95" y="378.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Canvas resizes and re-encodes photos</text>
<text x="95" y="415.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">User consent before upload</text>
<rect x="650" y="205" width="500" height="270" rx="22" fill="#1b3023" stroke="#3c5945" stroke-width="2"/>
<text x="675" y="247.24" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9ed3a5">02</text>
<text x="726" y="249.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#edf4e4">CropSight server</text>
<text x="675" y="304.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Node.js · native HTTP + fetch</text>
<text x="675" y="341.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Input validation and request limits</text>
<text x="675" y="378.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Stage prompts + team reference text</text>
<text x="675" y="415.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">API key stays on the server</text>
<rect x="1230" y="205" width="500" height="270" rx="22" fill="#1b3023" stroke="#3c5945" stroke-width="2"/>
<text x="1255" y="247.24" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9ed3a5">03</text>
<text x="1306" y="249.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#edf4e4">Vision model</text>
<text x="1255" y="304.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">OpenAI Chat Completions API</text>
<text x="1255" y="341.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">GPT-4o mini · pretrained model</text>
<text x="1255" y="378.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Photo(s) + context → structured JSON</text>
<text x="1255" y="415.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">No custom model training</text>
