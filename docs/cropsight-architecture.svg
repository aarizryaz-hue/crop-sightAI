<text x="1255" y="652.24" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9ed3a5">04</text>
<text x="1306" y="654.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#edf4e4">Validate the response</text>
<text x="1255" y="709.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">JavaScript + JSON Schema</text>
<text x="1255" y="746.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Check structure and evidence links</text>
<text x="1255" y="783.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Reject malformed output</text>
<text x="1255" y="820.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Not proof of agricultural accuracy</text>
<rect x="650" y="610" width="500" height="245" rx="22" fill="#1b3023" stroke="#3c5945" stroke-width="2"/>
<text x="675" y="652.24" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9ed3a5">05</text>
<text x="726" y="654.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#edf4e4">Evidence and next checks</text>
<text x="675" y="709.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Numbered visible observations</text>
<text x="675" y="746.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Possible causes + distinguishing checks</text>
<text x="675" y="783.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">One optional follow-up question</text>
<text x="675" y="820.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">English; Spanish in Settings</text>
<rect x="70" y="610" width="500" height="245" rx="22" fill="#1b3023" stroke="#3c5945" stroke-width="2"/>
<text x="95" y="652.24" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9ed3a5">06</text>
<text x="146" y="654.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#edf4e4">Supervisor handoff</text>
<text x="95" y="709.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Copy a concise observation summary</text>
<text x="95" y="746.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">Human reviews findings and limits</text>
<text x="95" y="783.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#d8e7d5">AI observations, not a diagnosis</text>
